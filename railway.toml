[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Notes:
# - Volume must be mounted at /home/paseo in Railway service settings
# - Set PASEO_HOSTNAMES=${{RAILWAY_PUBLIC_DOMAIN}}
# - Set PASEO_TRUSTED_PROXIES=true (or appropriate range) for Railway proxy
# - Target port should be 6767
