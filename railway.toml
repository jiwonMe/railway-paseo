[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# === Recommended Variables (set in Railway dashboard) ===
#
# PASEO_PASSWORD=${{secret(32)}}
# PASEO_HOSTNAMES=${{RAILWAY_PUBLIC_DOMAIN}}
# PASEO_TRUSTED_PROXIES=true
# PASEO_WEB_UI_ENABLED=true
# PASEO_LISTEN=0.0.0.0:${{PORT}}
#
# Optional:
# ANTHROPIC_API_KEY=
# OPENAI_API_KEY=
# GH_TOKEN=
#
# Volume: mount at /home/paseo
# Networking: public domain, target port 6767
